name: Test

# The suites that need neither a running server nor a credential: the Node unit tests. Anything
# that needs a deployed app is in ui-after-deploy.yml, which Vercel triggers once a deployment is
# live.
#
# These also run in .githooks/pre-push. A hook is the right place for fast feedback and the wrong
# place for a guarantee: `git push --no-verify` skips it, and a fresh clone has no hook at all
# until `npm run setup:hooks`. The hook stays; this is the floor underneath it.
on:
  # main only ever advances by a fast-forward of an already-green dev (merge-dev-to-main.sh), so
  # re-running the same commits there would burn a runner re-proving what the dev push just proved.
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - run: npm run test:unit
