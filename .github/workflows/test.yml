name: Test

# The suites that need neither a running server nor a credential: the Node unit tests. Anything
# that needs a deployed app is in ui-after-deploy.yml, which Vercel triggers once a deployment is
# live.
#
# Unit coverage is collected here (not in a local pre-push). A hook is the wrong place for that
# gate: it can be skipped with --no-verify, and a fresh clone has no hook until setup:hooks.
# Local pre-commit still runs lint / typecheck / knip.
on:
  # main only ever advances by a fast-forward of an already-green dev (merge-dev-to-main.sh), so
  # re-running the same commits there would burn a runner re-proving what the dev push just proved.
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Quiet pass + coverage floor (≥80% lines/functions, ≥70% branches).
      - run: npm run test:unit
