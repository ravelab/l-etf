name: Test

# The suites that need neither a running server nor a credential: the Node unit tests. Anything
# that needs a deployed app is in e2e-after-deploy.yml, which Vercel triggers once a deployment is
# live.
#
# Unit coverage (overall all-src % from node:test + Vitest/jsdom + V8 dumps) is
# collected here. Browser E2E coverage is collected on the preview deploy and
# merged with these dumps into one report.
on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Quiet pass: node:test + Vitest/jsdom, then overall src/** coverage
      # (unloaded files at 0%). NODE_V8_COVERAGE dumps feed post-deploy merge.
      - run: npm run test:unit
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/coverage/unit-v8

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-unit
          path: |
            coverage/unit-v8
            coverage/unit-jsdom
          if-no-files-found: error
